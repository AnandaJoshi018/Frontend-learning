<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Showcase App</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <header>
        <h1>Color Showcase Web App</h1>
        <p>Normal • Gradient • Neon • Glass • Pastel</p>
    </header>

    <section class="container">

        <!-- Normal Colors -->
        <div class="card red">Red</div>
        <div class="card blue">Blue</div>
        <div class="card green">Green</div>

        <!-- Gradient Colors -->
        <div class="card gradient1">Gradient 1</div>
        <div class="card gradient2">Gradient 2</div>
        <div class="card gradient3">Gradient 3</div>

        <!-- Neon -->
        <div class="card neon1">Neon Pink</div>
        <div class="card neon2">Neon Blue</div>

        <!-- Glass -->
        <div class="card glass">Glassmorphism</div>
        <div class="card glass2">Glassmorphism</div>

        <!-- Pastel -->
        <div class="card pastel1">Pastel Pink</div>
        <div class="card pastel2">Pastel Blue</div>
        

    </section>

    <button id="modeBtn">Toggle Dark Mode</button>

    <script src="script.js"></script>
</body>

</html>
